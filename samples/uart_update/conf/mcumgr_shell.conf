# Enable MCUmgr over the UART shell transport.
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y

# Do not use RTT or the raw UART log backend in this sample.
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=n

# Route logs through the shell backend so they can be controlled from shell.
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_CMDS=y
CONFIG_LOG_RUNTIME_FILTERING=y

# Keep UART quiet after reset so MCUmgr works by default. Enable logs manually
# from shell with: log enable inf
CONFIG_LOG_DEFAULT_LEVEL=0

